version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      bpmn-io:
        patterns:
          ['bpmn-js*', 'camunda-bpmn-*', '@bpmn-io/*', 'bpmnlint*', '@camunda/*', '*-bpmn-moddle']
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
